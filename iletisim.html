<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
<link rel="canonical" href="https://smmmyilmaz.com/iletisim.html">
    <title>İletişim – SMMM Yılmaz</title>
<meta name="description" content="SMMM Adem Yılmaz ile iletişime geçin. Ümraniye/İstanbul ofis adresi, telefon, e-posta ve online iletişim formu ile mali müşavirlik hizmeti talep edin.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <style>
        h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600;}
        body {
            font-family: 'DM Sans', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
        }
        h1 {
            color: #1a3052;
            text-align: center;
        }
        .info-box {
            margin: 20px 0;
            padding: 20px;
            background: #eef4fb;
            border-left: 4px solid #1a3052;
        }
        .info-box p {
            margin: 8px 0;
        }
        form {
            margin-top: 30px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #d4af5a;
            color: #081222;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background: #b8943f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>İletişim</h1>

    <div class="info-box">
        <h2>Bizimle İletişime Geçin</h2>
        <p><strong>Telefon:</strong> 0553 619 41 34</p>
        <p><strong>E-Posta:</strong> <a href="mailto:adem@smmmyilmaz.com">adem@smmmyilmaz.com</a></p>
        <p><strong>Adres:</strong> Ümraniye / İstanbul.</p>
    </div>

    <h2>İletişim Formu</h2>
    <form action="mailto:adem@smmmyilmaz.com" method="post" enctype="text/plain">
        <label for="name">Adınız ve Soyadınız</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-Posta Adresiniz</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Telefon (opsiyonel)</label>
        <input type="tel" id="phone" name="phone">

        <label for="message">Mesajınız</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Gönder</button>
    </form>
</div>

</body>
</html>
