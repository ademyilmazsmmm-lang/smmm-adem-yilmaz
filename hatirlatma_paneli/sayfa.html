<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hatırlatma">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon.png">
<title>Hatırlatma</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--fg:#1d2a25;--muted:#5d6b64;--line:#d6ddd8;--accent:#1f6f5c;--accent-fg:#fff;--accent-soft:#dcece6;--warn:#b4561b;--warn-soft:#f6e3d5;--danger:#a3342b}
@media (prefers-color-scheme:dark){:root{--bg:#121916;--surface:#1a2420;--fg:#e4ebe7;--muted:#9aa9a1;--line:#2c3a34;--accent:#5fc3a8;--accent-fg:#0d1512;--accent-soft:#1f3a32;--warn:#e69a62;--warn-soft:#3b2a1e;--danger:#e57d72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.4rem;margin:0}
h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
label,.lbl{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=date],select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:8px 13px;min-height:40px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.kaydet{font:inherit;font-weight:600;padding:13px;min-height:50px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.kaydet:disabled{opacity:.6}
.durum{min-height:1.4em;font-size:.9rem}.durum.hata{color:var(--danger)}.durum.ok{color:var(--accent)}
.onizleme{font-size:.85rem;color:var(--muted)}
.uyari{font-size:.85rem;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:6px}
.oge{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.oge:first-child{border-top:0}
.oge .m{min-width:0;overflow-wrap:anywhere}
.oge .t{font-size:.85rem;color:var(--muted)}
.oge .t b{color:var(--fg);font-weight:600}
.sil{font:inherit;font-size:.85rem;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.sil.emin{border-color:var(--danger);color:var(--danger);font-weight:600}
.gecmis .m,.gecmis .t{opacity:.6}
.bos{color:var(--muted);font-size:.9rem;padding:6px 0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;min-height:40px;display:flex;align-items:center}
footer{font-size:.8rem;color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Hatırlatma</h1>

<form class="card" id="form" autocomplete="off">
  <div>
    <label for="tur">Ne tür?</label>
    <select id="tur">
      <option value="genel">Genel hatırlatma</option>
      <option value="tasfiye">Tasfiye başladı (4 ay sonra kurumlar beyanı)</option>
      <option value="ilan">3. ilan tamam (kapanışı ver)</option>
      <option value="kapanis">Kapanış yapıldı (30 gün içinde kurumlar beyanı)</option>
    </select>
  </div>
  <div>
    <label for="metin" id="metinEtiket">Ne hatırlatılsın?</label>
    <input type="text" id="metin" maxlength="300" enterkeyhint="done" autofocus>
  </div>
  <div>
    <label for="tarih" id="tarihEtiket">Tarih</label>
    <input type="date" id="tarih" required>
    <div class="chips" id="hizli" style="margin-top:8px"></div>
  </div>
  <div>
    <span class="lbl">Mail kaç gün önce gelsin?</span>
    <div class="chips" id="gunler"></div>
  </div>
  <div id="tekrarKutu">
    <span class="lbl">Tekrar</span>
    <div class="chips" id="tekrar"></div>
  </div>
  <div class="onizleme" id="onizleme"></div>
  <div class="uyari" id="uyari" hidden></div>
  <button class="kaydet" type="submit" id="kaydet">Kaydet</button>
  <div class="durum" id="durum" role="status" aria-live="polite"></div>
</form>

<section>
  <h2>Yaklaşan</h2>
  <div class="card" id="liste"><div class="bos">Yükleniyor…</div></div>
</section>
<details id="gecmisKutu" hidden>
  <summary>Geçmiş</summary>
  <div class="card gecmis" id="gecmis"></div>
</details>

<footer>Mailler her sabah 08:00'de gelir. <a href="yedek.txt">Yedek indir</a></footer>
</main>

<script>
(function(){
  var BUGUN = "{{ bugun }}";
  var AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  var $ = function(id){ return document.getElementById(id); };

  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parse(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function gunEkle(d,n){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); return x; }
  function ayEkle(d,n){
    var t=d.getFullYear()*12+d.getMonth()+n, y=Math.floor(t/12), a=t%12;
    var son=new Date(y,a+1,0).getDate();
    return new Date(y,a,Math.min(d.getDate(),son));
  }
  function goster(s){ var d=parse(s); return d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear(); }
  function farkGun(s){ return Math.round((parse(s)-parse(BUGUN))/86400000); }
  function goreli(n){ return n===0?"bugün":n===1?"yarın":n+" gün sonra"; }

  var secili = {gunler:{1:true,0:true}, tekrar:"yok"};

  function chipYap(kap, liste, tikla){
    liste.forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.className="chip";
      b.textContent=o.ad; b.dataset.v=o.v; b.addEventListener("click", function(){ tikla(o,b); });
      kap.appendChild(b);
    });
  }

  chipYap($("hizli"), [
    {ad:"Yarın",g:1},{ad:"3 gün",g:3},{ad:"1 hafta",g:7},{ad:"2 hafta",g:14},{ad:"1 ay",a:1}
  ], function(o){
    var b=parse(BUGUN);
    $("tarih").value = iso(o.a ? ayEkle(b,o.a) : gunEkle(b,o.g));
    guncelle();
  });

  chipYap($("gunler"), [{ad:"7 gün",v:7},{ad:"3 gün",v:3},{ad:"1 gün",v:1},{ad:"Aynı gün",v:0}], function(o){
    if(secili.gunler[o.v]) delete secili.gunler[o.v]; else secili.gunler[o.v]=true;
    guncelle();
  });
  chipYap($("tekrar"), [{ad:"Yok",v:"yok"},{ad:"Her ay",v:"aylik"},{ad:"Her yıl",v:"yillik"}], function(o){
    secili.tekrar=o.v; guncelle();
  });

  var SABLON = {
    genel:  {etiket:"Ne hatırlatılsın?", tarih:"Tarih"},
    tasfiye:{etiket:"Firma adı", tarih:"Tasfiyeye giriş tarihi", ay:4, metin:function(f){return f+": tasfiye dönemi kurumlar beyannamesi";}, gunler:[7,0]},
    ilan:   {etiket:"Firma adı", tarih:"3. ilanın tarihi", metin:function(f){return f+": 3. ilan tamam, kapanışı ver";}, gunler:[0]},
    kapanis:{etiket:"Firma adı", tarih:"Kapanış tarihi", gun:30, metin:function(f){return f+": kapanış sonrası kurumlar beyannamesi son gün";}, gunler:[7,3,0]}
  };

  function etkinTarih(){
    var t=$("tarih").value; if(!t) return "";
    var s=SABLON[$("tur").value], d=parse(t);
    if(s.ay) d=ayEkle(d,s.ay);
    if(s.gun) d=gunEkle(d,s.gun);
    return iso(d);
  }
  function etkinMetin(){
    var m=$("metin").value.trim(), s=SABLON[$("tur").value];
    return s.metin ? (m ? s.metin(m) : "") : m;
  }
  function gunlerDizi(){ return Object.keys(secili.gunler).map(Number).sort(function(a,b){return b-a;}); }

  function guncelle(){
    var tur=$("tur").value, s=SABLON[tur], sablon=tur!=="genel";
    $("metinEtiket").textContent=s.etiket; $("tarihEtiket").textContent=s.tarih;
    $("hizli").hidden = sablon;
    $("tekrarKutu").hidden = sablon;
    if(sablon) secili.tekrar="yok";
    Array.prototype.forEach.call($("gunler").children, function(b){ b.setAttribute("aria-pressed", secili.gunler[b.dataset.v]?"true":"false"); });
    Array.prototype.forEach.call($("tekrar").children, function(b){ b.setAttribute("aria-pressed", secili.tekrar===b.dataset.v?"true":"false"); });
    var et=etkinTarih(), m=etkinMetin(), uy=$("uyari");
    $("onizleme").textContent = (et && m) ? ("Hatırlatma: "+goster(et)+" – "+m) : (sablon && et ? "Olay tarihi: "+goster(et) : "");
    uy.hidden = true;
    if(et && secili.tekrar==="yok"){
      var g=gunlerDizi();
      var gelecek = g.some(function(f){ return farkGun(et)-f > 0; });
      if(!g.length){ uy.textContent="En az bir gün seç."; uy.hidden=false; }
      else if(!gelecek){ uy.textContent="Bu tarih için sabah 08:00 maili kalmadı; bugünkü mail çoktan gitti. Daha ileri bir tarih ya da daha erken gün seç."; uy.hidden=false; }
    }
  }

  function durum(m,t){ var d=$("durum"); d.textContent=m; d.className="durum "+(t||""); }

  $("tur").addEventListener("change", function(){
    var s=SABLON[$("tur").value];
    secili.gunler={}; (s.gunler||[1,0]).forEach(function(g){ secili.gunler[g]=true; });
    guncelle();
  });
  $("metin").addEventListener("input", guncelle);
  $("tarih").addEventListener("input", guncelle);

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var m=etkinMetin(), et=etkinTarih(), g=gunlerDizi();
    if(!m){ durum("Metin boş olamaz.","hata"); $("metin").focus(); return; }
    if(!et){ durum("Tarih seç.","hata"); return; }
    if(!g.length){ durum("En az bir gün seç.","hata"); return; }
    $("kaydet").disabled=true; durum("Kaydediliyor…");
    fetch("ekle", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({metin:m, tarih:et, gunler:g, tekrar:secili.tekrar})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(x){
      if(!x.ok) throw new Error(x.j.hata||"Kaydedilemedi.");
      durum("Kaydedildi.","ok");
      $("metin").value=""; guncelle(); yukle(); $("metin").focus();
    })
    .catch(function(err){ durum(err.message||"Bağlantı hatası.","hata"); })
    .then(function(){ $("kaydet").disabled=false; });
  });

  function ogeYap(k, gecmis){
    var el=document.createElement("div"); el.className="oge";
    var sol=document.createElement("div"); sol.className="m";
    var m=document.createElement("div"); m.textContent=k.metin;
    var t=document.createElement("div"); t.className="t";
    var tekrarAd = k.tur==="aylik" ? "Her ay · " : k.tur==="yillik" ? "Her yıl · " : "";
    if(k.sonraki){
      var b=document.createElement("b"); b.textContent=goster(k.sonraki);
      t.appendChild(b);
      t.appendChild(document.createTextNode(" ("+goreli(farkGun(k.sonraki))+") · "+tekrarAd+k.gunler.map(function(g){return g===0?"aynı gün":g+" gün önce";}).join(", ")));
    } else {
      t.textContent = goster(k.tarih)+" (geçti)";
    }
    sol.appendChild(m); sol.appendChild(t);
    var s=document.createElement("button"); s.type="button"; s.className="sil"; s.textContent="Sil";
    var zamanlayici;
    s.addEventListener("click", function(){
      if(!s.classList.contains("emin")){
        s.classList.add("emin"); s.textContent="Emin misin?";
        zamanlayici=setTimeout(function(){ s.classList.remove("emin"); s.textContent="Sil"; }, 3000);
        return;
      }
      clearTimeout(zamanlayici);
      fetch("sil/"+k.id, {method:"POST"}).then(function(){ yukle(); });
    });
    el.appendChild(sol); el.appendChild(s);
    return el;
  }

  function yukle(){
    fetch("liste").then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(l){
      var yak=$("liste"), ges=$("gecmis"); yak.textContent=""; ges.textContent="";
      var y=0, g=0;
      l.forEach(function(k){
        if(k.sonraki){ yak.appendChild(ogeYap(k,false)); y++; }
        else { ges.appendChild(ogeYap(k,true)); g++; }
      });
      if(!y){ var b=document.createElement("div"); b.className="bos"; b.textContent="Yaklaşan hatırlatma yok."; yak.appendChild(b); }
      $("gecmisKutu").hidden = !g;
    }).catch(function(){ $("liste").textContent="Liste yüklenemedi. Sayfayı yenile."; });
  }

  $("tarih").value = iso(gunEkle(parse(BUGUN),1));
  guncelle(); yukle();
})();
</script>
</body>
</html>
