name: Hatırlatma Maili

# Bu depo herkese açık, günlükler de herkese görünür: hiçbir adımda hatırlatma metni yazdırılmaz.
# Veriler gizli "hatirlatma" deposundadır; HATIRLATMA_TOKEN ile okunur.
on:
  schedule:
    - cron: "*/10 * * * *"   # Her 10 dakikada bir; zamanı gelen hatırlatma varsa mail atar
  workflow_dispatch:

concurrency:
  group: hatirlatma-maili
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Gizli veri deposunu al
        id: veri
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ademyilmazsmmm-lang/hatirlatma
          token: ${{ secrets.HATIRLATMA_TOKEN }}
          path: veri

      - name: Hatırlatmaları gönder
        if: steps.veri.outcome == 'success'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 hatirlatici.py --veri veri

      - name: Gönderim kaydını kaydet
        # Gönderme adımı kısmen başarısız olsa bile gidenler kaydedilmeli (aynı mail tekrar gitmesin).
        # Çakışmada değişiklik kaybolursa sorun olmaz: "Tamam" yanıtları son 4 gün içinde yeniden işlenir.
        if: always() && steps.veri.outcome == 'success'
        working-directory: veri
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Gönderim kaydı ve mailden gelen "Tamam" yanıtlarıyla değişen dosyalar (hangisi varsa).
          for f in gonderim.json onay.json hatirlatmalar.json yapilacaklar.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Gönderim kaydı"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1

      - name: Veriye ulaşılamadı uyarısı
        if: steps.veri.outcome == 'failure'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 hatirlatici.py --uyari
