name: Hatırlatma Maili

on:
  schedule:
    - cron: "*/10 * * * *"   # Her 10 dakikada bir panele sorar; zamanı gelen hatırlatma varsa mail atar
  workflow_dispatch:

concurrency:
  group: hatirlatma-maili
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Hatırlatmaları gönder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
        run: python3 hatirlatici.py
