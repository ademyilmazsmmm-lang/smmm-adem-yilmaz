name: Sync Contact Info

on:
  push:
    branches:
      - main
    paths:
      - index.html
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: İletişim bilgilerini senkronize et
        run: python sync_contact.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Auto-sync contact info from index.html"
          git push
