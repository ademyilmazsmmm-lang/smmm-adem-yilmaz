<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f6f5c">
<title>Fatura Portalı</title>
<style>
:root{--bg:#edf1ee;--surface:#fff;--fg:#16211d;--muted:#5a6962;--line:#d3dcd7;--accent:#1f6f5c;--accent-fg:#fff;--accent-soft:#daece5;--danger:#b3261e;--warn:#935600;--warn-soft:#fae9cf}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--surface:#17201c;--fg:#e5ece8;--muted:#9aaba3;--line:#2a3832;--accent:#5fc3a8;--accent-fg:#0b1411;--accent-soft:#1b3730;--danger:#f08a80;--warn:#e8b460;--warn-soft:#3a2b13;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px 16px 60px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;margin:0}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.ust{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-height:46px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.satir{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:8px 13px;min-height:40px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{font:inherit;font-weight:600;padding:12px;min-height:48px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ikincil{background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.tehlike{background:var(--bg);color:var(--danger);border:1px solid var(--line);font-weight:500}
.k{font:inherit;font-size:.85rem;padding:6px 12px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
.durum{min-height:1.3em;font-size:.92rem;white-space:pre-wrap}.durum.hata{color:var(--danger)}.durum.ok{color:var(--accent)}
.not{font-size:.85rem;color:var(--muted);margin:0}
.sahte{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:.9rem}
.ozet{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}.ozet .t{text-align:right}.ozet .s{font-weight:700;color:var(--accent);border-top:2px solid var(--accent);padding-top:6px}
details>summary{cursor:pointer;font-weight:600;min-height:32px}details[open]>summary{margin-bottom:10px}
.kayit{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.alt{display:flex;flex-direction:column;gap:8px;padding-left:10px;border-left:3px solid var(--accent-soft)}
#giris{max-width:420px;margin:12vh auto 0}
</style>
</head>
<body>
<main id="giris" hidden>
  <h1>Fatura Portalı</h1>
  <form class="card" id="girisForm">
    <p class="not" id="girisYazi"></p>
    <input type="password" id="s1" placeholder="Uygulama şifresi" aria-label="Uygulama şifresi" autocomplete="current-password">
    <input type="password" id="s2" placeholder="Şifre (tekrar)" aria-label="Şifre tekrar" autocomplete="new-password" hidden>
    <button class="btn" type="submit" id="girisBtn">Aç</button>
    <div class="durum" id="girisDurum" role="status"></div>
  </form>
</main>

<main id="uyg" hidden>
  <div class="ust"><h1>Fatura Portalı</h1><button class="k" id="cikis" type="button">Çıkış</button></div>
  <div class="sahte" id="sahte" hidden>Deneme modu: GİB’e bağlanılmıyor, gerçek fatura kesilmez.</div>

  <div class="card"><h2>Mükellef</h2><div class="chips" id="mChips"></div><p class="not" id="mYok" hidden>Önce Ayarlar bölümünden mükellef ekleyin.</p></div>

  <div class="card">
    <h2>Fatura</h2>
    <textarea id="mesaj" placeholder="Müşterinin mesajı: Ahmet Yılmaz'a 5.000 TL servis taşımacılık, kdv hariç" aria-label="Müşterinin mesajı"></textarea>
    <button class="btn ikincil" type="button" id="oku">Mesajdan doldur</button>
    <div><label for="alici">Alıcı</label><select id="alici"></select></div>
    <div class="alt" id="yeniAlici" hidden>
      <div><label for="yAd">Alıcı unvanı / ad soyad</label><input id="yAd" autocomplete="off"></div>
      <div><label for="yVkn">VKN / TCKN</label><input id="yVkn" inputmode="numeric" autocomplete="off"></div>
      <button class="btn ikincil" type="button" id="aliciKaydet">Alıcıyı kaydet</button>
    </div>
    <div><label>Hizmet</label><div class="chips" id="hChips"></div></div>
    <div class="satir">
      <div><label for="tutar">Tutar (₺)</label><input id="tutar" inputmode="decimal" placeholder="5.000,00" autocomplete="off"></div>
      <div><label>Tutar türü</label><div class="chips"><button class="chip" type="button" data-dahil="0" aria-pressed="true">KDV hariç</button><button class="chip" type="button" data-dahil="1" aria-pressed="false">KDV dahil</button></div></div>
    </div>
    <div class="satir">
      <div><label for="kdv">KDV %</label><input id="kdv" inputmode="decimal"></div>
      <div><label for="tev">Tevkifat (x/10)</label><select id="tev"></select></div>
    </div>
    <div><label for="kod">Tevkifat kodu</label><input id="kod" inputmode="numeric" autocomplete="off"></div>
    <div class="ozet" id="ozet"></div>
  </div>

  <div class="card">
    <h2>Fatura kesme</h2>
    <button class="btn" type="button" id="taslak" disabled>1. Taslak oluştur</button>
    <div id="adim2" hidden class="alt">
      <p class="not">Taslak GİB’de oluştu. Portalda “Taslak Faturalar”da kontrol edebilirsiniz. Onaylanınca fatura kesilir ve geri alınamaz.</p>
      <button class="btn ikincil" type="button" id="sms">2. SMS kodu gönder</button>
      <div id="adim3" hidden class="alt">
        <div><label for="kodGir">SMS kodu</label><input id="kodGir" inputmode="numeric" autocomplete="one-time-code"></div>
        <button class="btn" type="button" id="imzala">3. Onayla ve faturayı kes</button>
      </div>
    </div>
    <div class="durum" id="durum" role="status"></div>
  </div>

  <details class="card" id="ayar"><summary>Ayarlar</summary><div id="ayarIc" style="display:flex;flex-direction:column;gap:10px"></div></details>
</main>

<script>
(function(){
  "use strict";
  var $ = function(i){ return document.getElementById(i); };
  var V = null, mSec = null, F = { hizmet: null, dahil: false, alici: "" }, son = { uuid: null, oid: null, hesap: null, imzali: false };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function uid(){ return Math.random().toString(36).slice(2, 10); }
  function trk(s){ return String(s || "").replace(/İ/g, "i").replace(/I/g, "ı").toLocaleLowerCase("tr-TR"); }
  function sayi(s){ var n = parseFloat(String(s || "").trim().replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; }
  function fmt(k){ return (k / 100).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function durum(m, t){ var d = $("durum"); d.className = "durum " + (t || ""); d.textContent = m; }

  function api(yol, yontem, govde){
    return fetch(yol, { method: yontem || "GET", headers: { "content-type": "application/json" }, body: govde ? JSON.stringify(govde) : undefined })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) { var e = new Error(j.hata || "Hata"); e.kod = r.status; throw e; } return j; }); });
  }

  /* ---------- giriş ---------- */
  var kurulu = false;
  function acilis(){
    api("/api/durum").then(function(d){
      kurulu = d.kurulu; $("sahte").hidden = !d.sahte;
      if (d.giris) return basla();
      $("uyg").hidden = true; $("giris").hidden = false;
      $("girisYazi").textContent = kurulu ? "Devam etmek için şifrenizi girin." : "İlk kurulum: bir uygulama şifresi belirleyin (en az 8 karakter). GİB şifreleri bununla şifrelenerek bilgisayarda saklanır.";
      $("s2").hidden = kurulu; $("girisBtn").textContent = kurulu ? "Aç" : "Şifreyi belirle";
    });
  }
  $("girisForm").addEventListener("submit", function(e){
    e.preventDefault(); var d = $("girisDurum"); d.className = "durum"; d.textContent = "";
    var s = $("s1").value;
    if (!kurulu && s !== $("s2").value) { d.className = "durum hata"; d.textContent = "Şifreler aynı değil."; return; }
    api(kurulu ? "/api/giris" : "/api/kurulum", "POST", { sifre: s }).then(function(){ $("s1").value = ""; $("s2").value = ""; basla(); }, function(er){ d.className = "durum hata"; d.textContent = er.message; });
  });
  $("cikis").addEventListener("click", function(){ api("/api/cikis", "POST", {}).then(function(){ V = null; acilis(); }); });
  function oturumDustu(er){ if (er.kod === 401) { acilis(); return true; } return false; }

  function basla(){
    api("/api/veri").then(function(v){
      V = v; $("giris").hidden = true; $("uyg").hidden = false;
      mSec = V.mukellefler.length ? V.mukellefler[0].id : null; F.hizmet = V.hizmetler[0] && V.hizmetler[0].id; F.alici = "";
      hepsi();
    });
  }
  function kaydetV(){ return api("/api/veri", "PUT", V).then(function(v){ V = v; }); }

  /* ---------- çizim ---------- */
  var mk = function(){ return V.mukellefler.filter(function(x){ return x.id === mSec; })[0] || null; };
  var hz = function(){ return V.hizmetler.filter(function(x){ return x.id === F.hizmet; })[0] || null; };
  function hepsi(){ cizM(); cizAlici(); cizH(); formDoldur(); onizle(); cizAyar(); }
  function cizM(){
    $("mChips").innerHTML = V.mukellefler.map(function(m){ return '<button class="chip" type="button" data-m="' + m.id + '" aria-pressed="' + (m.id === mSec) + '">' + esc(m.ad || "(adsız)") + '</button>'; }).join("");
    $("mYok").hidden = V.mukellefler.length > 0;
  }
  function cizAlici(){
    var m = mk(), h = '<option value="">— Alıcı seç —</option>';
    if (m) m.aliciler.forEach(function(a){ h += '<option value="' + a.id + '"' + (a.id === F.alici ? " selected" : "") + '>' + esc(a.ad) + '</option>'; });
    h += '<option value="__yeni"' + (F.alici === "__yeni" ? " selected" : "") + '>+ Yeni alıcı…</option>';
    $("alici").innerHTML = h; $("yeniAlici").hidden = F.alici !== "__yeni";
  }
  function cizH(){
    $("hChips").innerHTML = V.hizmetler.map(function(x){ return '<button class="chip" type="button" data-h="' + x.id + '" aria-pressed="' + (x.id === F.hizmet) + '">' + esc(x.ad) + '</button>'; }).join("");
    var t = ""; for (var i = 0; i <= 9; i++) t += '<option value="' + i + '">' + (i ? i + "/10" : "Yok") + '</option>'; $("tev").innerHTML = t;
  }
  function formDoldur(){
    var x = hz(); if (x) { $("kdv").value = String(x.kdv).replace(".", ","); $("tev").value = String(x.tev); $("kod").value = x.kod || ""; }
    document.querySelectorAll("[data-dahil]").forEach(function(b){ b.setAttribute("aria-pressed", String((b.getAttribute("data-dahil") === "1") === F.dahil)); });
  }
  function aliciBilgi(){
    if (F.alici === "__yeni") return { ad: $("yAd").value.trim(), vkn: $("yVkn").value.trim(), adres: "" };
    var m = mk(), a = m && m.aliciler.filter(function(q){ return q.id === F.alici; })[0];
    return a ? { ad: a.ad, vkn: a.vkn, adres: a.adres } : { ad: "", vkn: "", adres: "" };
  }
  function girdi(){
    var a = aliciBilgi(), x = hz();
    return { mukellefId: mSec, hizmetId: x && x.id, aliciUnvan: a.ad, aliciVkn: a.vkn, aliciAdres: a.adres, tutar: sayi($("tutar").value), kdvDahil: F.dahil, kdvOrani: sayi($("kdv").value), tevkifat: parseInt($("tev").value, 10) || 0, tevkifatKodu: $("kod").value };
  }
  var onizTimer;
  function onizle(){
    clearTimeout(onizTimer); sifirla();
    var g = girdi();
    if (!(g.tutar > 0)) { $("ozet").innerHTML = ""; kontrolBtn(); return; }
    onizTimer = setTimeout(function(){
      api("/api/hesapla", "POST", g).then(function(h){
        var s = [["Matrah", h.matrah], ["KDV %" + String(g.kdvOrani).replace(".", ","), h.kdv]];
        if (g.tevkifat) { s.push(["Tevkif edilen KDV (" + g.tevkifat + "/10)", h.tevKdv]); }
        s.push(["Toplam", h.toplam]);
        $("ozet").innerHTML = s.map(function(r){ return '<div>' + esc(r[0]) + '</div><div class="t">' + fmt(r[1]) + '</div>'; }).join("") + '<div class="s">Ödenecek tutar</div><div class="t s">' + fmt(h.odenecek) + '</div>';
      }, function(er){ if (!oturumDustu(er)) $("ozet").textContent = er.message; });
    }, 150);
    kontrolBtn();
  }
  function kontrolBtn(){ var g = girdi(); $("taslak").disabled = !(g.mukellefId && g.hizmetId && g.tutar > 0 && g.aliciUnvan && /^\d{10,11}$/.test(g.aliciVkn)); }
  function sifirla(){ son = { uuid: null, oid: null, hesap: null, imzali: false }; $("adim2").hidden = true; $("adim3").hidden = true; $("kodGir").value = ""; }

  /* ---------- mesajdan doldurma ---------- */
  function mesajOku(){
    var met = $("mesaj").value, kt = trk(met), m = mk(); if (!met.trim()) return;
    var re = /(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d{1,2}))?\s*(bin)?\s*(tl|₺|lira)?/gi, q, ad = [];
    while ((q = re.exec(met))) {
      var dg = q[1].replace(/\./g, ""); if (!q[4] && !q[3] && /^\d{10,11}$/.test(dg)) continue;
      var n = parseFloat(dg + (q[2] ? "." + q[2] : "")); if (q[3]) n *= 1000; ad.push({ n: n, tl: !!(q[4] || q[3]) });
    }
    var sec = ad.filter(function(a){ return a.tl; })[0] || ad.sort(function(a, b){ return b.n - a.n; })[0];
    if (sec) $("tutar").value = sec.n.toLocaleString("tr-TR", { useGrouping: false, maximumFractionDigits: 2 });
    if (/dahil/.test(kt)) F.dahil = true; else if (/hariç|haric|\+\s*kdv|kdv\s*ayrı/.test(kt)) F.dahil = false;
    V.hizmetler.forEach(function(x){ (x.anah || "").split(",").forEach(function(w){ w = trk(w).trim(); if (w && kt.indexOf(w) > -1) F.hizmet = x.id; }); });
    var bul = null;
    if (m) m.aliciler.forEach(function(a){
      var p = trk(a.ad).split(/\s+/).filter(function(w){ return w.length > 2; });
      var e = p.filter(function(w){ return kt.indexOf(w.slice(0, Math.max(4, w.length - 2))) > -1; });
      if (p.length && e.length >= Math.min(2, p.length) && (!bul || e.length > bul.n)) bul = { id: a.id, n: e.length };
    });
    var vk = met.match(/\b\d{10,11}\b/);
    if (bul) F.alici = bul.id; else { F.alici = "__yeni"; if (vk) $("yVkn").value = vk[0]; }
    cizAlici(); cizH(); formDoldur(); onizle();
    durum(bul ? "Mesajdan dolduruldu. Alıcıyı ve tutarı kontrol edin." : "Alıcı kayıtlı değil; unvanı yazıp kaydedebilirsiniz.", "ok");
  }

  /* ---------- fatura kesme adımları ---------- */
  function yurut(btn, is, ok){
    btn.disabled = true;
    is().then(ok, function(er){ if (!oturumDustu(er)) durum(er.message, "hata"); }).then(function(){ btn.disabled = false; kontrolBtn(); });
  }
  $("taslak").addEventListener("click", function(){
    var g = girdi();
    if (!confirm("GİB’de taslak oluşturulsun mu?\n\n" + g.aliciUnvan + " (" + g.aliciVkn + ")\nTutar: " + $("tutar").value + (g.kdvDahil ? " (KDV dahil)" : " (KDV hariç)"))) return;
    yurut($("taslak"), function(){ durum("Taslak oluşturuluyor…"); return api("/api/taslak", "POST", g); }, function(r){
      son.uuid = r.uuid; son.hesap = r.hesap; $("adim2").hidden = false; durum(r.mesaj || "Taslak oluşturuldu.", "ok");
    });
  });
  $("sms").addEventListener("click", function(){
    yurut($("sms"), function(){ durum("SMS isteniyor…"); return api("/api/sms", "POST", { mukellefId: mSec }); }, function(r){
      son.oid = r.oid; $("adim3").hidden = false; durum("SMS kodu mükellefin kayıtlı telefonuna gönderildi.", "ok"); $("kodGir").focus();
    });
  });
  $("imzala").addEventListener("click", function(){
    if (son.imzali) return;
    if (!confirm("Fatura ONAYLANIP KESİLECEK. Bu işlem geri alınamaz. Devam edilsin mi?")) return;
    yurut($("imzala"), function(){ return api("/api/imzala", "POST", { mukellefId: mSec, uuid: son.uuid, oid: son.oid, kod: $("kodGir").value.trim() }); }, function(r){
      son.imzali = true; durum((r.mesaj || "Fatura onaylandı.") + "\nYeni fatura için formu temizleyin.", "ok"); $("adim2").hidden = true;
      $("tutar").value = ""; $("mesaj").value = ""; F.alici = ""; cizAlici(); $("ozet").innerHTML = ""; kontrolBtn();
    });
  });

  /* ---------- olaylar ---------- */
  $("mChips").addEventListener("click", function(e){ var t = e.target.closest("button"); if (!t) return; mSec = t.getAttribute("data-m"); F.alici = ""; cizM(); cizAlici(); onizle(); });
  $("hChips").addEventListener("click", function(e){ var t = e.target.closest("button"); if (!t) return; F.hizmet = t.getAttribute("data-h"); cizH(); formDoldur(); onizle(); });
  document.querySelectorAll("[data-dahil]").forEach(function(b){ b.addEventListener("click", function(){ F.dahil = b.getAttribute("data-dahil") === "1"; formDoldur(); onizle(); }); });
  $("alici").addEventListener("change", function(){ F.alici = this.value; $("yeniAlici").hidden = F.alici !== "__yeni"; onizle(); });
  ["tutar", "kdv", "tev", "kod", "yAd", "yVkn"].forEach(function(i){ $(i).addEventListener("input", onizle); $(i).addEventListener("change", onizle); });
  $("oku").addEventListener("click", mesajOku);
  $("aliciKaydet").addEventListener("click", function(){
    var m = mk(), a = aliciBilgi(); if (!m) return durum("Önce mükellef ekleyin.", "hata");
    if (!a.ad || !/^\d{10,11}$/.test(a.vkn)) return durum("Unvan ve 10/11 haneli VKN/TCKN gerekli.", "hata");
    var n = { id: uid(), ad: a.ad, vkn: a.vkn, adres: "" }; m.aliciler.push(n); F.alici = n.id;
    kaydetV().then(function(){ cizAlici(); cizAyar(); onizle(); durum("Alıcı kaydedildi.", "ok"); });
  });

  /* ---------- ayarlar ---------- */
  function cizAyar(){
    var h = "";
    V.mukellefler.forEach(function(m){
      h += '<div class="kayit" data-mid="' + m.id + '"><div><label>Mükellef unvanı</label><input data-f="ad" value="' + esc(m.ad) + '"></div>' +
        '<div><label>VKN / TCKN</label><input data-f="vkn" inputmode="numeric" value="' + esc(m.vkn) + '"></div>' +
        '<div><label>GİB e-Arşiv kullanıcı kodu</label><input data-f="kullanici" autocomplete="off" value="' + esc(m.kullanici) + '"></div>' +
        '<div><label>GİB e-Arşiv şifresi ' + (m.sifreVar ? '(kayıtlı — değiştirmek için yazın)' : '(kayıtlı değil)') + '</label><input data-f="gibSifre" type="password" autocomplete="new-password" value=""></div>';
      if (m.aliciler.length) h += '<label>Kayıtlı alıcılar</label>';
      m.aliciler.forEach(function(a){ h += '<div class="satir" data-aid="' + a.id + '"><span>' + esc(a.ad) + '<br><small>' + esc(a.vkn) + '</small></span><button class="btn tehlike" type="button" data-sil-a="' + a.id + '">Sil</button></div>'; });
      h += '<button class="btn tehlike" type="button" data-sil-m="' + m.id + '">Mükellefi sil</button></div>';
    });
    h += '<button class="btn ikincil" type="button" id="mEkle">+ Mükellef ekle</button><h2>Hizmetler</h2>';
    V.hizmetler.forEach(function(x){
      h += '<div class="kayit" data-hid="' + x.id + '"><input data-f="ad" value="' + esc(x.ad) + '" aria-label="Hizmet adı"><div class="satir"><div><label>KDV %</label><input data-f="kdv" inputmode="decimal" value="' + esc(x.kdv) + '"></div><div><label>Tevkifat x/10</label><input data-f="tev" inputmode="numeric" value="' + esc(x.tev) + '"></div></div>' +
        '<div><label>Tevkifat kodu</label><input data-f="kod" inputmode="numeric" value="' + esc(x.kod) + '"></div><div><label>Mesajda aranacak kelimeler</label><input data-f="anah" value="' + esc(x.anah) + '"></div>' +
        '<button class="btn tehlike" type="button" data-sil-h="' + x.id + '">Hizmeti sil</button></div>';
    });
    h += '<button class="btn ikincil" type="button" id="hEkle">+ Hizmet ekle</button><button class="btn" type="button" id="ayarKaydet">Ayarları kaydet</button><div class="durum" id="ayarDurum" role="status"></div>';
    $("ayarIc").innerHTML = h;
  }
  $("ayarIc").addEventListener("input", function(e){
    var f = e.target.getAttribute("data-f"); if (!f) return;
    var mEl = e.target.closest("[data-mid]"), hEl = e.target.closest("[data-hid]"), v = e.target.value;
    if (mEl) V.mukellefler.filter(function(x){ return x.id === mEl.getAttribute("data-mid"); })[0][f] = v;
    else if (hEl) { var x = V.hizmetler.filter(function(q){ return q.id === hEl.getAttribute("data-hid"); })[0]; x[f] = f === "kdv" ? sayi(v) : f === "tev" ? Math.min(9, Math.max(0, parseInt(v, 10) || 0)) : v; }
  });
  $("ayarIc").addEventListener("click", function(e){
    var t = e.target, id, yenile = true;
    if ((id = t.getAttribute("data-sil-m"))) { if (!confirm("Mükellef ve alıcıları silinsin mi?")) return; V.mukellefler = V.mukellefler.filter(function(x){ return x.id !== id; }); if (mSec === id) mSec = V.mukellefler[0] ? V.mukellefler[0].id : null; F.alici = ""; }
    else if ((id = t.getAttribute("data-sil-a"))) { var m = V.mukellefler.filter(function(x){ return x.id === t.closest("[data-mid]").getAttribute("data-mid"); })[0]; m.aliciler = m.aliciler.filter(function(x){ return x.id !== id; }); if (F.alici === id) F.alici = ""; }
    else if ((id = t.getAttribute("data-sil-h"))) { if (V.hizmetler.length < 2) return; V.hizmetler = V.hizmetler.filter(function(x){ return x.id !== id; }); if (F.hizmet === id) F.hizmet = V.hizmetler[0].id; }
    else if (t.id === "mEkle") { var n = { id: uid(), ad: "Yeni mükellef", vkn: "", kullanici: "", sifreVar: false, aliciler: [] }; V.mukellefler.push(n); if (!mSec) mSec = n.id; }
    else if (t.id === "hEkle") V.hizmetler.push({ id: uid(), ad: "Yeni hizmet", kdv: 20, tev: 0, kod: "", anah: "" });
    else if (t.id === "ayarKaydet") { yenile = false; kaydetV().then(function(){ hepsi(); var d = $("ayarDurum"); d.className = "durum ok"; d.textContent = "Kaydedildi."; }, function(er){ var d = $("ayarDurum"); d.className = "durum hata"; d.textContent = er.message; }); return; }
    else return;
    kaydetV().then(hepsi);
  });

  acilis();
})();
</script>
