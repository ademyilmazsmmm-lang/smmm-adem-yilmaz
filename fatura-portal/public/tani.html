<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yazı testi">
<link rel="manifest" href="/manifest.webmanifest?tam=1">
<link rel="apple-touch-icon" href="/ikon-180.png">
<title>Yazı testi</title>
<style>
body{margin:0;padding:16px;font:16px/1.4 system-ui,-apple-system,sans-serif;background:#f2f4f3;color:#111}
h1{font-size:1.1rem;margin:0 0 4px}p{margin:4px 0 12px;font-size:.85rem;color:#555}
label{display:block;font-size:.8rem;margin:12px 0 4px;color:#333}
input,textarea,.ce{width:100%;box-sizing:border-box;font:inherit}
.stil{padding:11px 12px;border:1px solid #ccd;border-radius:10px;background:#fff;min-height:48px}
#log{font:12px/1.35 ui-monospace,Menlo,monospace;background:#111;color:#9f9;padding:8px;border-radius:8px;white-space:pre-wrap;min-height:120px;margin-top:14px;word-break:break-all}
.ce{border:1px solid #ccd;border-radius:10px;background:#fff;padding:11px 12px;min-height:48px}
button{font:inherit;padding:10px 14px;margin-top:10px;border-radius:8px;border:1px solid #999;background:#fff}
</style></head><body>
<h1>Yazı testi</h1>
<p id="bilgi"></p>
<label>A) Çıplak metin kutusu (hiç stil yok)</label><input id="a" type="text">
<label>B) Çıplak şifre kutusu</label><input id="b" type="password">
<label>C) Çok satırlı kutu</label><textarea id="c" rows="2"></textarea>
<label>D) Bizim stille metin kutusu</label><input id="d" class="stil" type="text">
<label>E) Bizim stille şifre kutusu (autocomplete kapalı)</label><input id="e" class="stil" type="password" autocomplete="off">
<label>F) Düzenlenebilir alan (contenteditable)</label><div id="f" class="ce" contenteditable="true"></div>
<label>G) Sayı kutusu</label><input id="g" class="stil" inputmode="numeric">
<button type="button" id="t">Kaydı temizle</button>
<div id="log"></div>
<script>
(function(){
  var L = document.getElementById("log"), n = 0;
  function y(m){ n++; var t = new Date(); L.textContent = (n + " " + t.toTimeString().slice(0,8) + " " + m + "\n") + L.textContent.slice(0, 1800); }
  var vv = window.visualViewport, ilk = vv ? Math.round(vv.height) : innerHeight;
  document.getElementById("bilgi").textContent = "standalone=" + (navigator.standalone === true) + " display=" + (matchMedia("(display-mode: standalone)").matches ? "standalone" : "tarayici") + " yükseklik=" + ilk + " " + navigator.userAgent.replace(/.*OS ([\d_]+).*/, "iOS $1");
  ["a","b","c","d","e","f","g"].forEach(function(i){
    var e = document.getElementById(i);
    ["touchstart","click","focus","blur","input","keydown","beforeinput"].forEach(function(o){
      e.addEventListener(o, function(ev){ y(i.toUpperCase() + " " + o + (o === "input" || o === "keydown" ? " [" + (ev.data || ev.key || "") + "]" : "") + (o === "focus" ? " aktif=" + (document.activeElement === e) : "")); }, { passive: true });
    });
  });
  if (vv) vv.addEventListener("resize", function(){ y("görünür yükseklik " + ilk + " -> " + Math.round(vv.height) + (vv.height < ilk - 80 ? " (KLAVYE AÇILDI)" : "")); });
  document.getElementById("t").addEventListener("click", function(){ L.textContent = ""; n = 0; });
  y("sayfa yüklendi");
})();
</script></body></html>
