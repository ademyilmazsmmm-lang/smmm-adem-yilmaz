<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Müşavir Otomasyon Sistemi | Tahakkuk Gönderim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card { border: none; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .durum-bekliyor { color: #0d6efd; }
    .durum-gonderildi { color: #198754; }
    .durum-hata { color: #dc3545; }
    #mesajTablosu td { vertical-align: middle; font-size: .9rem; }
    .mesaj-onizleme { max-width: 340px; white-space: normal; }
    .uyari-satir { background-color: #fff3cd; }
  </style>
</head>
<body>
<div class="container-fluid py-4 px-3 px-md-5">

  <div class="d-flex align-items-center mb-4">
    <i class="bi bi-send-check fs-2 text-primary me-2"></i>
    <div>
      <h1 class="h4 mb-0">Müşavir Otomasyon Sistemi</h1>
      <small class="text-muted">WhatsApp Tahakkuk Gönderim Modülü</small>
    </div>
  </div>

  <!-- Klasor secimi -->
  <div class="card mb-3">
    <div class="card-body">
      <label for="klasorYolu" class="form-label fw-semibold">Klasör Yolu</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-folder2-open"></i></span>
        <input type="text" id="klasorYolu" class="form-control" placeholder="Örn: C:\Tahakkuklar">
        <button id="btnTara" class="btn btn-primary" type="button">
          <i class="bi bi-search"></i> Dosyaları Getir
        </button>
      </div>
      <div id="taramaMesaj" class="form-text mt-2"></div>
    </div>
  </div>

  <!-- Vade belirleme -->
  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h6 fw-semibold mb-3"><i class="bi bi-calendar-event"></i> Vade Tarihleri</h2>
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label for="vadeKdv" class="form-label">KDV Vadesi</label>
          <input type="date" id="vadeKdv" class="form-control vade-input" data-vergi="KDV">
        </div>
        <div class="col-12 col-md-4">
          <label for="vadeStopaj" class="form-label">Stopaj / SGK Vadesi</label>
          <input type="date" id="vadeStopaj" class="form-control vade-input" data-vergi="STOPAJ / SGK">
        </div>
        <div class="col-12 col-md-4">
          <label for="vadeGecici" class="form-label">Geçici Vergi Vadesi</label>
          <input type="date" id="vadeGecici" class="form-control vade-input" data-vergi="PEŞİN VERGİ (P.V.)">
        </div>
      </div>
    </div>
  </div>

  <!-- Tablo -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="mesajTablosu">
          <thead class="table-light">
            <tr>
              <th>Firma</th>
              <th>Vergi Türü</th>
              <th>Dönem</th>
              <th>Telefon No</th>
              <th>Gönderilecek Mesaj</th>
              <th>Durum</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody id="tabloGovde">
            <tr>
              <td colspan="7" class="text-center text-muted py-4">
                Henüz dosya listelenmedi. Klasör yolunu girip "Dosyaları Getir" butonuna basın.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  let satirlar = []; // backend'den gelen ham veriler
  const tabloGovde = document.getElementById('tabloGovde');
  const taramaMesaj = document.getElementById('taramaMesaj');

  function vadeAl(vergiTuru) {
    const input = document.querySelector(`.vade-input[data-vergi="${vergiTuru}"]`);
    if (!input || !input.value) return '';
    // yyyy-mm-dd -> dd/mm/yyyy
    const [yil, ay, gun] = input.value.split('-');
    return `${gun}/${ay}/${yil}`;
  }

  function mesajOlustur(satir) {
    const vade = vadeAl(satir.vergi_turu);
    const vadeMetni = vade ? vade : '(vade girilmedi)';
    return `${satir.firma_tam} - ${satir.donem || 'Dönem Belirsiz'} Dönemi ${satir.vergi_turu} Ödemesi. Vade: ${vadeMetni}`;
  }

  function durumHucresi(satir) {
    if (satir.durum === 'gonderildi') {
      return `<span class="durum-gonderildi"><i class="bi bi-check-circle-fill"></i> Gönderildi</span>`;
    }
    if (satir.durum === 'hata') {
      return `<span class="durum-hata" title="${satir.hataMesaji || ''}"><i class="bi bi-x-circle-fill"></i> Hata</span>`;
    }
    return `<span class="durum-bekliyor"><i class="bi bi-clock-fill"></i> Bekliyor</span>`;
  }

  function tabloyuCiz() {
    if (satirlar.length === 0) {
      tabloGovde.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Bu klasörde .pdf dosyası bulunamadı.</td></tr>`;
      return;
    }

    tabloGovde.innerHTML = satirlar.map(satir => {
      const mesaj = mesajOlustur(satir);
      satir.mesaj = mesaj; // gonder sirasinda kullanilacak guncel mesaj
      const telefonHucre = satir.telefon
        ? satir.telefon
        : `<span class="badge text-bg-warning"><i class="bi bi-exclamation-triangle"></i> Telefon Bulunamadı</span>`;
      const gonderiliyorMu = satir.gonderiliyor;
      const gonderildi = satir.durum === 'gonderildi';
      const disabled = (!satir.telefon || gonderiliyorMu || gonderildi) ? 'disabled' : '';

      return `
        <tr class="${satir.uyari ? 'uyari-satir' : ''}" data-id="${satir.id}">
          <td>${satir.firma_tam}</td>
          <td>${satir.vergi_turu}</td>
          <td>${satir.donem || '-'}</td>
          <td>${telefonHucre}</td>
          <td class="mesaj-onizleme">${mesaj}</td>
          <td>${durumHucresi(satir)}</td>
          <td>
            <button class="btn btn-sm btn-success btn-gonder" data-id="${satir.id}" ${disabled}>
              ${gonderiliyorMu
                ? '<span class="spinner-border spinner-border-sm"></span>'
                : '<i class="bi bi-whatsapp"></i> Gönder'}
            </button>
          </td>
        </tr>`;
    }).join('');
  }

  document.getElementById('btnTara').addEventListener('click', async () => {
    const klasorYolu = document.getElementById('klasorYolu').value.trim();
    if (!klasorYolu) {
      taramaMesaj.innerHTML = '<span class="text-danger">Lütfen bir klasör yolu girin.</span>';
      return;
    }

    taramaMesaj.innerHTML = '<span class="text-muted"><span class="spinner-border spinner-border-sm"></span> Taranıyor...</span>';

    try {
      const res = await fetch('/klasor_tara', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ klasor_yolu: klasorYolu })
      });
      const veri = await res.json();

      if (!veri.success) {
        taramaMesaj.innerHTML = `<span class="text-danger">${veri.error}</span>`;
        satirlar = [];
        tabloyuCiz();
        return;
      }

      satirlar = veri.dosyalar.map(d => ({ ...d, durum: 'bekliyor', gonderiliyor: false }));
      const uyariSayisi = satirlar.filter(s => s.uyari).length;
      taramaMesaj.innerHTML = `<span class="text-success">${veri.adet} PDF dosyası bulundu.</span>` +
        (uyariSayisi > 0 ? ` <span class="text-warning">${uyariSayisi} firma rehberde bulunamadı, firmalar.json dosyasını güncelleyin.</span>` : '');
      tabloyuCiz();
    } catch (err) {
      taramaMesaj.innerHTML = `<span class="text-danger">Bağlantı hatası: ${err}</span>`;
    }
  });

  document.querySelectorAll('.vade-input').forEach(input => {
    input.addEventListener('input', tabloyuCiz);
  });

  tabloGovde.addEventListener('click', async (e) => {
    const btn = e.target.closest('.btn-gonder');
    if (!btn) return;

    const id = Number(btn.dataset.id);
    const satir = satirlar.find(s => s.id === id);
    if (!satir) return;

    satir.gonderiliyor = true;
    tabloyuCiz();

    try {
      const res = await fetch('/gonder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dosya_yolu: satir.dosya_yolu,
          telefon: satir.telefon,
          mesaj: satir.mesaj
        })
      });
      const veri = await res.json();

      satir.gonderiliyor = false;
      if (veri.success) {
        satir.durum = 'gonderildi';
      } else {
        satir.durum = 'hata';
        satir.hataMesaji = veri.error;
        alert(`Gönderim başarısız: ${veri.error}`);
      }
    } catch (err) {
      satir.gonderiliyor = false;
      satir.durum = 'hata';
      satir.hataMesaji = String(err);
      alert(`Bağlantı hatası: ${err}`);
    }

    tabloyuCiz();
  });
</script>
</body>
</html>
